name: Pages

# Publishes the static website in site/ to GitHub Pages.

on:
    push:
        branches: [main]
        paths: ['site/**', '.github/workflows/pages.yml']
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - name: Check the download mapping
              run: node site/assets/js/download.test.mjs
            - name: Stage the site without notes and tests
              run: |
                  rsync -a --exclude '*.md' --exclude '*.test.mjs' --exclude 'package.json' --exclude 'site-animations.json' site/ _site/
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site
            - id: deployment
              uses: actions/deploy-pages@v4
