[package]
name = "dibe-jni"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JNI bindings of the DIBE engine for the Android app (libdibe.so)"

[lib]
name = "dibe"
# rlib too, so the example drives the same functions on a device without the app.
crate-type = ["cdylib", "rlib"]

[dependencies]
dibe-core = { path = "../dibe-core" }
whisper-rs = { path = "../whisper-rs", features = ["ffi"] }
vad-rs = { path = "../vad-rs" }

anyhow = "1"
jni = "0.22.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3.5"
