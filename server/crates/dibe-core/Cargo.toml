[package]
name = "dibe-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine selection, live transcription and resampling shared by vibe-server and the Android app"

[dependencies]
whisper-rs = { path = "../whisper-rs", features = ["ffi"] }
nemotron-rs = { path = "../nemotron-rs" }
parakeet-rs = { path = "../parakeet-rs" }
vad-rs = { path = "../vad-rs" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
utoipa = { version = "5", optional = true }

[features]
# OpenAPI schemas for vibe-server's docs.
schema = ["dep:utoipa"]
